<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Менеджер продуктов — CRUD каталог товаров" />
  <title>Каталог товаров</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>Каталог товаров</h1>
    <button id="btn-open-create" class="btn btn-primary">+ Добавить</button>
  </header>

  <div id="notifications"></div>

  <div id="modal-overlay" class="overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Новый продукт</h2>
        <button id="btn-close-modal" class="btn-close">✕</button>
      </div>

      <form id="product-form" enctype="multipart/form-data" novalidate>
        <input type="hidden" id="product-id" />

        <label for="field-name">Название *</label>
        <input type="text" id="field-name" placeholder="Название продукта" maxlength="255" />

        <label for="field-price">Цена (₽) *</label>
        <input type="number" id="field-price" placeholder="0.00" min="0" step="0.01" />

        <label for="field-category">Категория</label>
        <input type="text" id="field-category" placeholder="Категория" maxlength="100" />

        <label for="field-description">Описание</label>
        <textarea id="field-description" placeholder="Описание продукта..." rows="3"></textarea>

        <label>Изображение</label>
        <div id="upload-area">
          <input type="file" id="field-image" accept="image/jpeg,image/png,image/gif,image/webp" />
          <img id="image-preview" class="preview hidden" alt="Preview" />
        </div>

        <div id="form-errors" class="errors hidden"></div>

        <div class="form-buttons">
          <button type="button" id="btn-cancel" class="btn">Отмена</button>
          <button type="submit" id="btn-submit" class="btn btn-primary">
            <span id="btn-submit-text">Создать</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <main>
    <div class="toolbar">
      <input type="text" id="search-input" placeholder="Поиск..." />
      <span>Найдено: <strong id="count">0</strong></span>
    </div>

    <div id="loading" class="loading">Загрузка...</div>

    <div id="empty-state" class="empty hidden">
      <p>Продукты не найдены. Добавьте первый продукт.</p>
    </div>

    <table id="products-table" class="hidden">
      <thead>
        <tr>
          <th>Фото</th>
          <th>Название</th>
          <th>Категория</th>
          <th>Цена</th>
          <th>Описание</th>
          <th>Действия</th>
        </tr>
      </thead>
      <tbody id="products-body"></tbody>
    </table>
  </main>

  <div id="delete-overlay" class="overlay hidden">
    <div class="modal modal-small">
      <h3>Удалить продукт?</h3>
      <p>Это действие нельзя отменить.</p>
      <div class="form-buttons">
        <button id="btn-cancel-delete" class="btn">Отмена</button>
        <button id="btn-confirm-delete" class="btn btn-danger">Удалить</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
