version: '3.8'

services:

  postgres:
    image: postgres:16-alpine
    container_name: producthub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: products_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d products_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
    container_name: producthub-server
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: products_db
      DB_USER: admin
      DB_PASSWORD: secret123
      JWT_SECRET: super_secret_jwt_key_change_in_production_32chars
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 7d
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: your_email@gmail.com
      SMTP_PASS: your_app_password
      SMTP_FROM: no-reply@producthub.local
      RESET_TOKEN_EXPIRES_MINUTES: 30
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/src/uploads
      - logs_data:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./client
    container_name: producthub-client
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  postgres_data:
  uploads_data:
  logs_data:
