name: CI — Lint & Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    name: Lint & Test (Node.js)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package.json

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        env:
          NODE_ENV: test
          JWT_SECRET: test_secret_key_for_github_actions_32ch
          JWT_ACCESS_EXPIRES: 15m
          JWT_REFRESH_EXPIRES: 7d
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: test_db
          DB_USER: test
          DB_PASSWORD: test
        run: npm test
